<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienes Raices</title>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>

    <header class="header">
        <div class="contenedor contenido-header">
            <div class="barra">
                <a href="/">
                    <img src="/img/logo.svg" alt="Logotipo de Bienes Raices">
                </a>

                <div class="mobile-menu">
                    <img src="/img/barras.svg" alt="icono menu responsive">
                </div>

                <div class="derecha">
                    <img class="dark-mode-boton" src="/img/dark-mode.svg">
                    <nav class="navegacion">
                        <a href="/nosotros.html">Nosotros</a>
                        <a href="/anuncio.html">Anuncios</a>
                        <a href="/blog.html">Blog</a>
                        <a href="/contacto.html">Contacto</a>
                    </nav>
                </div>

            </div>
        </div>
    </header>

    <main class="contenedor seccion">

        <div class="filtros">

            <input type="text" id="filtroTexto" placeholder="Buscar...">

            <input type="number" id="precioMin" placeholder="Precio mínimo">
            <input type="number" id="precioMax" placeholder="Precio máximo">

            <input type="number" id="habitaciones" placeholder="Habitaciones">

            <input type="text" id="ciudad" placeholder="Ciudad">

            <button id="btnFiltrar" class="boton-amarillo">Filtrar</button>

        </div>

        <h2>Casas y Depas en Venta</h2>

        <!-- Aquí se cargarán las propiedades dinámicamente -->
        <div id="lista-anuncios" class="contenedor-anuncios"></div>

    </main>

    <footer class="footer seccion">
        <div class="contenedor contenedor-footer">
            <nav class="navegacion">
                <a href="/nosotros.html">Nosotros</a>
                <a href="/anuncios.html">Anuncios</a>
                <a href="/blog.html">Blog</a>
                <a href="/contacto.html">Contacto</a>
            </nav>
        </div>

        <p class="copyright">Todos los derechos Reservados 2025 &copy;</p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/modernize.js"></script>
    <script src="/js/anuncios.js"></script>
</body>

</html>
