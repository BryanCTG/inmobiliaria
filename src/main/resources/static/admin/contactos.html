<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactos | Admin Belar</title>
  <link rel="icon" href="/img/belar-mark.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#131209">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="/img/belar-mark.svg" alt="Belar" width="36" height="36" style="border-radius:9px;">
        <div class="sidebar-logo-text">Belar Inmobiliaria<small>Panel de Administración</small></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <p class="sidebar-section-label">Principal</p>
        <a href="/admin/index.html" class="sidebar-link"><i class="ph ph-squares-four"></i> Dashboard</a>
      </div>
      <div class="sidebar-section">
        <p class="sidebar-section-label">Gestión</p>
        <a href="/admin/propiedades.html" class="sidebar-link"><i class="ph ph-house"></i> Propiedades</a>
        <a href="/admin/crear.html" class="sidebar-link"><i class="ph ph-plus-circle"></i> Nueva Propiedad</a>
        <a href="/admin/contactos.html" class="sidebar-link active"><i class="ph ph-envelope-simple"></i> Contactos</a>
      </div>
      <div class="sidebar-section">
        <p class="sidebar-section-label">Sitio</p>
        <a href="/" class="sidebar-link" target="_blank"><i class="ph ph-arrow-square-out"></i> Ver sitio</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"><i class="ph ph-user"></i></div>
        <div>
          <div class="sidebar-user-name">Administrador</div>
          <div class="sidebar-user-role">Super Admin</div>
        </div>
      </div>
      <form action="/logout?destino=admin" method="post">
        <button type="submit" class="btn btn-danger btn-sm" style="width:100%;justify-content:center;">
          <i class="ph ph-sign-out"></i> Cerrar sesión
        </button>
      </form>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle-btn" id="sidebarToggle"><i class="ph ph-list"></i></button>
        <div>
          <div class="topbar-title">Mensajes de Contacto</div>
          <div class="topbar-breadcrumb">
            <a href="/admin/index.html">Admin</a>
            <i class="ph ph-caret-right sep"></i>
            <span>Contactos</span>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <a href="/" target="_blank" class="topbar-icon-btn"><i class="ph ph-arrow-square-out"></i></a>
      </div>
    </header>

    <div class="admin-content">

      <div class="page-header">
        <div class="page-header-info">
          <h1>Mensajes Recibidos</h1>
          <p id="conteoContactos">Cargando...</p>
        </div>
      </div>

      <!-- Filtros + Búsqueda -->
      <div class="admin-card" style="margin-bottom:24px;">
        <div class="admin-card-body" style="padding:16px 24px;">
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
            <div style="position:relative;flex:1;min-width:200px;">
              <i class="ph ph-magnifying-glass" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--neutral-60);font-size:2rem;"></i>
              <input type="text" id="searchContacto" class="form-control" placeholder="Buscar por nombre o correo..." style="padding-left:44px;">
            </div>
            <select id="filtroEstado" class="form-control" style="max-width:200px;">
              <option value="">Todos los estados</option>
              <option value="pendiente">⏳ Pendientes</option>
              <option value="atendido">✅ Atendidos</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Contadores de estado -->
      <div style="display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;">
        <div style="background:rgba(201,169,110,0.14);border:1px solid rgba(201,169,110,0.4);border-radius:var(--radius-medium);padding:14px 20px;display:flex;align-items:center;gap:10px;flex:1;min-width:160px;">
          <i class="ph ph-clock" style="font-size:2.4rem;color:#C9A96E;"></i>
          <div>
            <div style="font-size:2.4rem;font-weight:700;color:#C9A96E;line-height:1;" id="numeroPendientes">—</div>
            <div style="font-size:var(--fs-label-small);color:#C9A96E;">Pendientes</div>
          </div>
        </div>
        <div style="background:rgba(140,201,160,0.12);border:1px solid rgba(140,201,160,0.4);border-radius:var(--radius-medium);padding:14px 20px;display:flex;align-items:center;gap:10px;flex:1;min-width:160px;">
          <i class="ph ph-check-circle" style="font-size:2.4rem;color:#8CC9A0;"></i>
          <div>
            <div style="font-size:2.4rem;font-weight:700;color:#8CC9A0;line-height:1;" id="numeroAtendidos">—</div>
            <div style="font-size:var(--fs-label-small);color:#8CC9A0;">Atendidos</div>
          </div>
        </div>
      </div>

      <!-- Grid de cards -->
      <div id="contenedor-contactos" class="contact-cards-grid">
        <div class="spinner">Cargando mensajes...</div>
      </div>

      <!-- ── PAGINADOR ─────────────────────────────────────────── -->
      <div class="paginacion-wrapper" id="paginacionWrapper" style="display:none;">

        <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;gap:12px;">
          <!-- Texto info -->
          <span class="paginacion-info" id="paginacionInfo"></span>

          <!-- Selector de items por página -->
          <div class="por-pagina-selector">
            <span>Mostrar</span>
            <select id="selectPorPagina">
              <option value="6">6</option>
              <option value="9" selected>9</option>
              <option value="12">12</option>
              <option value="18">18</option>
            </select>
            <span>por página</span>
          </div>
        </div>

        <!-- Botones de página -->
        <div class="paginacion-controles" id="paginacionControles"></div>

      </div>
      <!-- ── FIN PAGINADOR ──────────────────────────────────────── -->

    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/admin-layout.js"></script>
  <script>
    // ═══════════════════════════════════════════════════════════
    //  ESTADO GLOBAL
    // ═══════════════════════════════════════════════════════════
    let todosContactos  = [];   // todos los contactos cargados
    let listaFiltrada   = [];   // resultado de búsqueda/filtro
    let mapaPropiedades = {};
    let paginaActual    = 1;
    let porPagina       = 9;    // valor inicial del selector

    // ═══════════════════════════════════════════════════════════
    //  CARGA INICIAL
    // ═══════════════════════════════════════════════════════════
    async function cargarContactos() {
      try {
        const [resC, resP] = await Promise.all([
          fetch('/api/contacto'),
          fetch('/api/propiedades')
        ]);
        todosContactos = await resC.json();
        const propiedades = await resP.json();

        propiedades.forEach(p => { mapaPropiedades[p.id] = p.titulo; });
        todosContactos.reverse();   // más reciente primero

        listaFiltrada = [...todosContactos];
        actualizarContadores();
        mostrarPagina(1);

      } catch (err) {
        document.getElementById('contenedor-contactos').innerHTML =
          '<div class="empty-state"><i class="ph ph-warning-circle"></i><h3>Error al cargar</h3><p>No se pudieron obtener los mensajes</p></div>';
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  PAGINACIÓN
    // ═══════════════════════════════════════════════════════════
    function mostrarPagina(pagina) {
      paginaActual = pagina;
      const total      = listaFiltrada.length;
      const totalPags  = Math.max(1, Math.ceil(total / porPagina));
      if (paginaActual > totalPags) paginaActual = totalPags;

      const inicio = (paginaActual - 1) * porPagina;
      const fin    = Math.min(inicio + porPagina, total);
      const slice  = listaFiltrada.slice(inicio, fin);

      // Animación fade
      const contenedor = document.getElementById('contenedor-contactos');
      contenedor.classList.add('fade-out');
      setTimeout(() => {
        renderizarContactos(slice);
        contenedor.classList.remove('fade-out');
        actualizarPaginador(total, totalPags);
        // Scroll suave al top del grid
        contenedor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 150);
    }

    function actualizarPaginador(total, totalPags) {
      const wrapper    = document.getElementById('paginacionWrapper');
      const infoEl     = document.getElementById('paginacionInfo');
      const controlesEl = document.getElementById('paginacionControles');

      if (total === 0) { wrapper.style.display = 'none'; return; }
      wrapper.style.display = 'flex';

      const inicio = (paginaActual - 1) * porPagina + 1;
      const fin    = Math.min(paginaActual * porPagina, total);
      infoEl.innerHTML = `Mostrando <strong>${inicio}–${fin}</strong> de <strong>${total}</strong> mensajes`;

      // Construir botones
      controlesEl.innerHTML = '';

      // ← Anterior
      const btnPrev = crearBotonPag('', false, paginaActual === 1, () => mostrarPagina(paginaActual - 1));
      btnPrev.innerHTML = '<i class="ph ph-caret-left"></i>';
      btnPrev.title = 'Página anterior';
      controlesEl.appendChild(btnPrev);

      // Páginas con ellipsis
      const paginas = paginasAMostrar(paginaActual, totalPags);
      let anteriorFueEllipsis = false;

      paginas.forEach(p => {
        if (p === '...') {
          if (!anteriorFueEllipsis) {
            const el = document.createElement('span');
            el.className = 'page-ellipsis';
            el.textContent = '…';
            controlesEl.appendChild(el);
            anteriorFueEllipsis = true;
          }
          return;
        }
        anteriorFueEllipsis = false;
        const btn = crearBotonPag(p, p === paginaActual, false, () => mostrarPagina(p));
        controlesEl.appendChild(btn);
      });

      // → Siguiente
      const btnNext = crearBotonPag('', false, paginaActual === totalPags, () => mostrarPagina(paginaActual + 1));
      btnNext.innerHTML = '<i class="ph ph-caret-right"></i>';
      btnNext.title = 'Página siguiente';
      controlesEl.appendChild(btnNext);
    }

    /** Devuelve el array de páginas/ellipsis a renderizar */
    function paginasAMostrar(actual, total) {
      if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);

      const delta = 1; // vecinos a cada lado de la página actual
      const rango = [];

      for (let i = Math.max(2, actual - delta); i <= Math.min(total - 1, actual + delta); i++) {
        rango.push(i);
      }

      const resultado = [1];
      if (rango[0] > 2)             resultado.push('...');
      rango.forEach(p => resultado.push(p));
      if (rango[rango.length - 1] < total - 1) resultado.push('...');
      resultado.push(total);

      return resultado;
    }

    function crearBotonPag(label, activo, deshabilitado, onClick) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (activo ? ' active' : '');
      btn.textContent = label;
      btn.disabled    = deshabilitado;
      if (!deshabilitado) btn.addEventListener('click', onClick);
      return btn;
    }

    // ═══════════════════════════════════════════════════════════
    //  FILTROS  (reinician siempre a página 1)
    // ═══════════════════════════════════════════════════════════
    function aplicarFiltros() {
      const q   = document.getElementById('searchContacto').value.toLowerCase().trim();
      const est = document.getElementById('filtroEstado').value;

      listaFiltrada = todosContactos.filter(c => {
        const coincideTexto = !q ||
          c.nombre.toLowerCase().includes(q) ||
          c.correo.toLowerCase().includes(q);
        const coincideEstado =
          est === '' ? true :
          est === 'pendiente' ? !c.atendido :
          c.atendido;
        return coincideTexto && coincideEstado;
      });

      mostrarPagina(1);
    }

    document.getElementById('searchContacto').addEventListener('input',  aplicarFiltros);
    document.getElementById('filtroEstado').addEventListener('change', aplicarFiltros);

    document.getElementById('selectPorPagina').addEventListener('change', function () {
      porPagina = parseInt(this.value);
      mostrarPagina(1);
    });

    // ═══════════════════════════════════════════════════════════
    //  CONTADORES
    // ═══════════════════════════════════════════════════════════
    function actualizarContadores() {
      const pendientes = todosContactos.filter(c => !c.atendido).length;
      const atendidos  = todosContactos.filter(c =>  c.atendido).length;
      document.getElementById('numeroPendientes').textContent = pendientes;
      document.getElementById('numeroAtendidos').textContent  = atendidos;
      document.getElementById('conteoContactos').textContent  =
        `${todosContactos.length} mensajes — ${pendientes} pendientes, ${atendidos} atendidos`;
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER DE CARDS
    // ═══════════════════════════════════════════════════════════
    function renderizarContactos(lista) {
      const contenedor = document.getElementById('contenedor-contactos');

      if (lista.length === 0) {
        contenedor.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="ph ph-envelope-simple"></i>
            <h3>Sin mensajes</h3>
            <p>No hay mensajes que coincidan con el filtro</p>
          </div>`;
        return;
      }

      const medioIconos = { telefono: 'phone', correo: 'envelope-simple', whatsapp: 'whatsapp-logo' };

      contenedor.innerHTML = lista.map(c => {
        const nombrePropiedad = mapaPropiedades[c.casaInteres] || 'No especificada';
        const iniciales  = c.nombre ? c.nombre.charAt(0).toUpperCase() : '?';
        const iconoMedio = medioIconos[c.medioContacto] || 'address-book';
        const atendido   = c.atendido === true;

        return `
          <div class="contact-card" style="border-left-color:${atendido ? 'var(--success)' : 'var(--primary-100)'};">

            <div class="contact-card-header">
              <div class="contact-card-avatar"
                   style="background:${atendido ? 'rgba(140,201,160,0.18);color:#8CC9A0' : ''};">
                ${iniciales}
              </div>
              <div style="flex:1;">
                <div class="contact-card-name">${esc(c.nombre)}</div>
                <div class="contact-card-date" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;">
                  <span class="badge badge-blue" style="display:inline-flex;align-items:center;gap:4px;">
                    <i class="ph ph-${iconoMedio}" style="font-size:1.4rem;"></i>
                    ${esc(c.medioContacto || 'correo')}
                  </span>
                  <span class="badge ${atendido ? 'badge-green' : ''}"
                        style="${!atendido ? 'background:rgba(201,169,110,0.14);color:#C9A96E;' : ''}display:inline-flex;align-items:center;gap:4px;">
                    <i class="ph ph-${atendido ? 'check-circle' : 'clock'}" style="font-size:1.4rem;"></i>
                    ${atendido ? 'Atendido' : 'Pendiente'}
                  </span>
                </div>
              </div>
            </div>

            <div class="contact-card-body">
              <div class="contact-card-row">
                <i class="ph ph-envelope-simple"></i>
                <span>${esc(c.correo)}</span>
              </div>
              ${c.celular ? `
              <div class="contact-card-row">
                <i class="ph ph-phone"></i>
                <span>${esc(c.celular)}</span>
              </div>` : ''}
              <div class="contact-card-row">
                <i class="ph ph-house"></i>
                <span>${esc(nombrePropiedad)}</span>
              </div>
              ${c.fechaVisita ? `
              <div class="contact-card-row">
                <i class="ph ph-calendar-check"></i>
                <span><strong style="color:var(--gold)">Visita solicitada:</strong> ${esc(new Date(c.fechaVisita + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }))}${c.horaVisita ? ' a las ' + esc(c.horaVisita) : ''}</span>
              </div>` : ''}
              ${c.mensaje ? `<div class="contact-card-message">"${esc(c.mensaje)}"</div>` : ''}
            </div>

            <div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--neutral-95);">
              <button onclick="toggleAtendido('${c.id}')"
                class="btn btn-sm ${atendido ? 'btn-outline' : 'btn-fill'}"
                style="flex:1;justify-content:center;">
                <i class="ph ph-${atendido ? 'arrow-counter-clockwise' : 'check-circle'}" style="font-size:1.6rem;"></i>
                ${atendido ? 'Marcar pendiente' : 'Marcar atendido'}
              </button>
              <button onclick="eliminarContacto('${c.id}')"
                class="btn btn-danger btn-sm"
                title="Eliminar mensaje">
                <i class="ph ph-trash" style="font-size:1.6rem;"></i>
              </button>
            </div>

          </div>
        `;
      }).join('');
    }

    // ═══════════════════════════════════════════════════════════
    //  ACCIONES
    // ═══════════════════════════════════════════════════════════
    async function toggleAtendido(id) {
      try {
        const res = await fetch(`/api/contacto/${id}/atendido`, { method: 'PATCH' });
        if (!res.ok) throw new Error();
        const idx = todosContactos.findIndex(c => c.id === id);
        if (idx !== -1) todosContactos[idx].atendido = !todosContactos[idx].atendido;
        actualizarContadores();
        aplicarFiltros();          // re-filtra y re-pagina manteniendo la búsqueda activa
      } catch {
        alert('Error al actualizar el estado del mensaje');
      }
    }

    async function eliminarContacto(id) {
      if (!confirm('¿Seguro que deseas eliminar este mensaje? Esta acción no se puede deshacer.')) return;
      try {
        const res = await fetch(`/api/contacto/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        todosContactos = todosContactos.filter(c => c.id !== id);
        listaFiltrada  = listaFiltrada.filter(c => c.id !== id);
        actualizarContadores();
        // Si la página actual queda vacía, retrocedemos una
        const totalPags = Math.max(1, Math.ceil(listaFiltrada.length / porPagina));
        if (paginaActual > totalPags) paginaActual = totalPags;
        mostrarPagina(paginaActual);
      } catch {
        alert('Error al eliminar el mensaje');
      }
    }

    // ── Arranque ────────────────────────────────────────────────
    cargarContactos();
  </script>
</body>
</html>
