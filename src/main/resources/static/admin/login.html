<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Admin Bienes Raíces</title>
  <link rel="shortcut icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="login-page">
    <div class="login-box">

      <div class="login-header">
        <div class="login-logo">
          <div class="logo-icon" style="background:var(--gradient);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:2.4rem;">
            <span class="material-symbols-rounded">home_work</span>
          </div>
          <span style="font-size:2.2rem;font-weight:700;color:var(--neutral-10);">Bienes<span style="color:var(--primary-100);">Raíces</span></span>
        </div>
        <h1>Bienvenido de vuelta</h1>
        <p>Ingresa tus credenciales para acceder al panel</p>
      </div>

      <div id="error-message" class="login-error">
        <span class="material-symbols-rounded">error</span>
        Usuario o contraseña incorrectos
      </div>

      <form action="/login" method="post" class="login-form">
        <div class="form-group">
          <label class="form-label" for="username">
            <span class="material-symbols-rounded" style="font-size:1.6rem;vertical-align:middle;">person</span>
            Usuario
          </label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
        </div>

        <div class="form-group" style="position:relative;">
          <label class="form-label" for="password">
            <span class="material-symbols-rounded" style="font-size:1.6rem;vertical-align:middle;">lock</span>
            Contraseña
          </label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password" style="padding-right:48px;">
          <button type="button" id="togglePassword" style="position:absolute;right:14px;bottom:13px;background:none;border:none;cursor:pointer;color:var(--neutral-60);display:flex;">
            <span class="material-symbols-rounded" id="eyeIcon" style="font-size:2rem;">visibility</span>
          </button>
        </div>

        <button type="submit" class="btn btn-fill" style="width:100%;justify-content:center;padding:14px;font-size:var(--fs-label-large);margin-top:8px;">
          <span class="material-symbols-rounded">login</span>
          Iniciar sesión
        </button>
      </form>

      <div class="login-footer-link">
        <a href="/">← Volver al sitio</a>
      </div>

    </div>
  </div>

  <script src="/js/login.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    });
  </script>
</body>
</html>
