<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Admin Belar Inmobiliaria</title>
  <link rel="icon" href="/img/belar-mark.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#131209">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="login-page">
    <div class="login-box">

      <div class="login-header">
        <div class="login-logo">
          <img src="/img/belar-mark.svg" alt="Belar" width="44" height="44" style="border-radius:12px;">
          <span style="font-size:2.2rem;font-weight:700;color:var(--neutral-10);">Belar <span style="color:var(--primary-100);">Inmobiliaria</span></span>
        </div>
        <h1>Bienvenido de vuelta</h1>
        <p>Ingresa tus credenciales para acceder al panel</p>
      </div>

      <div id="error-message" class="login-error">
        <i class="ph ph-warning-circle"></i>
        Usuario o contraseña incorrectos
      </div>

      <form action="/login" method="post" class="login-form">
        <div class="form-group">
          <label class="form-label" for="username">
            <i class="ph ph-user" style="font-size:1.6rem;vertical-align:middle;"></i>
            Usuario
          </label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
        </div>

        <div class="form-group" style="position:relative;">
          <label class="form-label" for="password">
            <i class="ph ph-lock-simple" style="font-size:1.6rem;vertical-align:middle;"></i>
            Contraseña
          </label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password" style="padding-right:48px;">
          <button type="button" id="togglePassword" style="position:absolute;right:14px;bottom:13px;background:none;border:none;cursor:pointer;color:var(--neutral-60);display:flex;">
            <i class="ph ph-eye" id="eyeIcon" style="font-size:2rem;"></i>
          </button>
        </div>

        <button type="submit" class="btn btn-fill" style="width:100%;justify-content:center;padding:14px;font-size:var(--fs-label-large);margin-top:8px;">
          <i class="ph ph-sign-in"></i>
          Iniciar sesión
        </button>
      </form>

      <div class="login-footer-link">
        <a href="/">← Volver al sitio</a>
      </div>

    </div>
  </div>

  <script src="/js/login.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'ph ph-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'ph ph-eye';
      }
    });
  </script>
</body>
</html>
