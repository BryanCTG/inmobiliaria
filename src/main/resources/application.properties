# ==============================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================
server.port=8080

# ==============================
# CONEXIÓN A MONGODB
# ==============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bienesraices}
spring.data.mongodb.database=bienesraices

# ==============================
# CONFIGURACIÓN GENERAL
# ==============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Muestra las operaciones en consola
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# ==============================
# CORREO (opcional)
# ==============================
# Si MAIL_HOST no esta definido, no se envian correos y todo lo demas funciona igual.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Direccion que recibe el aviso de cada mensaje de contacto
app.notify.admin-email=${NOTIFY_ADMIN_EMAIL:}
app.notify.from=${MAIL_FROM:${MAIL_USER:}}

# Limite de mensajes de contacto por IP (cantidad y ventana en segundos)
app.ratelimit.contacto.max=10
app.ratelimit.contacto.ventana=600
